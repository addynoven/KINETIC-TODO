name: Build & Publish Release APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 🛠️ Expo Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Compile Release APKs (with ABI splits & R8 minification)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 🚀 Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: "Kinetic Todo ${{ github.ref_name || github.event.inputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/*.apk
